<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-label="DeepSeek-OCR-2 vs. Unlimited-OCR-2. DeepSeek-OCR-2 reads one page at a time, so page 1 produces table 1 and page 2 produces table 2. Unlimited-OCR-2 reads both pages together and produces one table.">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #0f172a; font-size: 18px; }
		.mid { text-anchor: middle; }
		.muted { fill: #475569; }
		.page { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
		.line { fill: #e2e8f0; }
		.cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
		.arrow { fill: none; stroke: #475569; stroke-width: 2; }
		.figtitle { font-size: 20px; font-weight: 700; fill: #022791; text-anchor: middle; }
	</style>
	<rect x="0.75" y="0.75" width="778.5" height="438.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
	<line x1="390" y1="24" x2="390" y2="416" stroke="#e2e8f0" stroke-width="1.5"/>
	<text x="185" y="44" class="figtitle">DeepSeek-OCR-2</text>
	<text x="565" y="44" class="figtitle">Unlimited-OCR-2</text>
	<rect x="70" y="70" width="90" height="120" rx="4" class="page"/>
	<rect x="82" y="86" width="66" height="8" rx="3" class="line"/>
	<rect x="82" y="104" width="66" height="8" rx="3" class="line"/>
	<rect x="82" y="122" width="44" height="8" rx="3" class="line"/>
	<text x="115" y="214" class="mid muted">page 1</text>
	<path d="M115 226 L115 260" class="arrow" marker-end="url(#arrow)"/>
	<rect x="67" y="270" width="96" height="20" class="cell"/>
	<rect x="67" y="290" width="96" height="20" class="cell"/>
	<rect x="67" y="310" width="96" height="20" class="cell"/>
	<line x1="115" y1="270" x2="115" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
	<text x="115" y="356" class="mid">table 1</text>
	<rect x="210" y="70" width="90" height="120" rx="4" class="page"/>
	<rect x="222" y="86" width="66" height="8" rx="3" class="line"/>
	<rect x="222" y="104" width="66" height="8" rx="3" class="line"/>
	<rect x="222" y="122" width="44" height="8" rx="3" class="line"/>
	<text x="255" y="214" class="mid muted">page 2</text>
	<path d="M255 226 L255 260" class="arrow" marker-end="url(#arrow)"/>
	<rect x="207" y="270" width="96" height="20" class="cell"/>
	<rect x="207" y="290" width="96" height="20" class="cell"/>
	<rect x="207" y="310" width="96" height="20" class="cell"/>
	<line x1="255" y1="270" x2="255" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
	<text x="255" y="356" class="mid">table 2</text>
	<rect x="450" y="70" width="90" height="120" rx="4" class="page"/>
	<rect x="462" y="86" width="66" height="8" rx="3" class="line"/>
	<rect x="462" y="104" width="66" height="8" rx="3" class="line"/>
	<rect x="462" y="122" width="44" height="8" rx="3" class="line"/>
	<text x="495" y="214" class="mid muted">page 1</text>
	<rect x="590" y="70" width="90" height="120" rx="4" class="page"/>
	<rect x="602" y="86" width="66" height="8" rx="3" class="line"/>
	<rect x="602" y="104" width="66" height="8" rx="3" class="line"/>
	<rect x="602" y="122" width="44" height="8" rx="3" class="line"/>
	<text x="635" y="214" class="mid muted">page 2</text>
	<path d="M495 226 V244 H635 V226" class="arrow"/>
	<path d="M565 244 L565 260" class="arrow" marker-end="url(#arrow)"/>
	<rect x="505" y="270" width="120" height="20" class="cell"/>
	<rect x="505" y="290" width="120" height="20" class="cell"/>
	<rect x="505" y="310" width="120" height="20" class="cell"/>
	<rect x="505" y="330" width="120" height="20" class="cell"/>
	<rect x="505" y="350" width="120" height="20" class="cell"/>
	<rect x="505" y="370" width="120" height="20" class="cell"/>
	<line x1="565" y1="270" x2="565" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
	<text x="565" y="416" class="mid">one table</text>
</svg>
