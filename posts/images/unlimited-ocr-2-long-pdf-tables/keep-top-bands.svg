<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 514" role="img" aria-label="Unlimited-OCR-2: read only the relevant bands. First, each page is split into horizontal bands. Then, before each word, the model reads in full only the most relevant bands, here the table header on page 29 and the bands around where it is writing on page 30, and skips the rest.">
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #0f172a; font-size: 18px; }
		.title { font-weight: 600; }
		.mid { text-anchor: middle; }
		.muted { fill: #475569; }
		.page { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
		.band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
		.summary { fill: #022791; }
		.read { fill: #4d75fe; }
		.skip { fill: #e2e8f0; }
		.writing { fill: none; stroke: #ff8a69; stroke-width: 3; }
		.figtitle { font-size: 20px; font-weight: 700; fill: #022791; text-anchor: middle; }
	</style>
	<rect x="0.75" y="0.75" width="778.5" height="512.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
	<text x="390" y="40" class="figtitle">Unlimited-OCR-2: read only the relevant bands</text>
	<g transform="translate(0 44)">
	<text x="24" y="44" class="title">1. Split each page into bands</text>
	<rect x="135" y="64" width="90" height="120" rx="4" class="page"/>
	<rect x="145" y="76" width="70" height="20" rx="3" class="band"/>
	<rect x="145" y="102" width="70" height="20" rx="3" class="band"/>
	<rect x="145" y="128" width="70" height="20" rx="3" class="band"/>
	<rect x="145" y="154" width="70" height="20" rx="3" class="band"/>
	<text x="180" y="210" class="mid muted">page 1</text>
	<text x="320" y="130" class="mid muted">…</text>
	<rect x="415" y="64" width="90" height="120" rx="4" class="page"/>
	<rect x="425" y="76" width="70" height="20" rx="3" class="band"/>
	<rect x="425" y="102" width="70" height="20" rx="3" class="band"/>
	<rect x="425" y="128" width="70" height="20" rx="3" class="band"/>
	<rect x="425" y="154" width="70" height="20" rx="3" class="band"/>
	<text x="460" y="210" class="mid muted">page 29</text>
	<rect x="555" y="64" width="90" height="120" rx="4" class="page"/>
	<rect x="565" y="76" width="70" height="20" rx="3" class="band"/>
	<rect x="565" y="102" width="70" height="20" rx="3" class="band"/>
	<rect x="565" y="128" width="70" height="20" rx="3" class="band"/>
	<rect x="565" y="154" width="70" height="20" rx="3" class="band"/>
	<text x="600" y="210" class="mid muted">page 30</text>
	<text x="24" y="256" class="title">2. Read only the most relevant bands in full</text>
	<rect x="135" y="276" width="90" height="120" rx="4" class="page"/>
	<rect x="145" y="288" width="70" height="20" rx="3" class="skip"/>
	<rect x="145" y="314" width="70" height="20" rx="3" class="skip"/>
	<rect x="145" y="340" width="70" height="20" rx="3" class="skip"/>
	<rect x="145" y="366" width="70" height="20" rx="3" class="skip"/>
	<text x="320" y="342" class="mid muted">…</text>
	<rect x="415" y="276" width="90" height="120" rx="4" class="page"/>
	<rect x="425" y="288" width="70" height="20" rx="3" class="read"/>
	<rect x="425" y="314" width="70" height="20" rx="3" class="skip"/>
	<rect x="425" y="340" width="70" height="20" rx="3" class="skip"/>
	<rect x="425" y="366" width="70" height="20" rx="3" class="skip"/>
	<rect x="555" y="276" width="90" height="120" rx="4" class="page"/>
	<rect x="565" y="288" width="70" height="20" rx="3" class="skip"/>
	<rect x="565" y="314" width="70" height="20" rx="3" class="read"/>
	<rect x="565" y="340" width="70" height="20" rx="3" class="read"/>
	<rect x="562" y="337" width="76" height="26" rx="5" class="writing"/>
	<rect x="565" y="366" width="70" height="20" rx="3" class="skip"/>
	<rect x="24" y="434" width="18" height="18" rx="3" class="read"/>
	<text x="52" y="449">read in full</text>
	<rect x="214" y="434" width="18" height="18" rx="3" class="skip"/>
	<text x="242" y="449">skipped</text>
	<rect x="374" y="434" width="18" height="18" rx="3" class="writing"/>
	<text x="402" y="449">writing here</text>
	</g>
</svg>
