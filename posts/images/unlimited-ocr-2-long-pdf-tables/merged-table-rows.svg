	<text x="540" y="261" class="num">22</text>
	<text x="642" y="261" class="num">1,124</text>

	<!-- page brackets -->
	<path d="M672 94 H682 V178 H672" class="b71"/>
	<text x="690" y="142" class="l71">page 71</text>
	<path d="M672 190 H682 V274 H672" class="b72"/>
	<text x="690" y="238" class="l72">page 72</text>
