<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 414" role="img" aria-label="Obvious approach: reread every page. While writing a row on page 30, the model looks at every part of every page, from page 1 to page 30, for every word it writes.">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" fill="#4d75fe"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #0f172a; font-size: 18px; }
		.title { font-weight: 600; }
		.mid { text-anchor: middle; }
		.muted { fill: #475569; }
		.looked { fill: #4d75fe; }
		.writing { fill: none; stroke: #ff8a69; stroke-width: 3; }
		.arrow { fill: none; stroke: #4d75fe; stroke-width: 2; }
		.figtitle { font-size: 20px; font-weight: 700; fill: #022791; text-anchor: middle; }
	</style>
	<rect x="0.75" y="0.75" width="778.5" height="412.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
	<text x="390" y="40" class="figtitle">Obvious approach: reread every page</text>
	<g transform="translate(0 44)">
	<text x="390" y="44" class="mid title">writing a row on page 30</text>
	<path d="M390 58 L180 142" class="arrow" marker-end="url(#arrow)"/>
	<rect x="135" y="150" width="90" height="120" rx="4" class="looked"/>
	<text x="180" y="296" class="mid muted">page 1</text>
	<text x="320" y="216" class="mid muted">…</text>
	<path d="M390 58 L460 142" class="arrow" marker-end="url(#arrow)"/>
	<rect x="415" y="150" width="90" height="120" rx="4" class="looked"/>
	<text x="460" y="296" class="mid muted">page 29</text>
	<path d="M390 58 L600 142" class="arrow" marker-end="url(#arrow)"/>
	<rect x="555" y="150" width="90" height="120" rx="4" class="looked"/>
	<rect x="560" y="212" width="80" height="22" rx="4" class="writing"/>
	<text x="600" y="296" class="mid muted">page 30</text>
	<rect x="24" y="330" width="18" height="18" rx="3" class="looked"/>
	<text x="52" y="345">looked at</text>
	<rect x="204" y="330" width="18" height="18" rx="3" class="writing"/>
	<text x="232" y="345">writing here</text>
	</g>
</svg>
