<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" role="img" aria-label="Which step is slow? On the in-memory engine, filter, join and group_by run one after another, so the long join bar shows join takes the longest. On the streaming engine, all three steps run at the same time and their bars span almost the same time, so you can't tell which step is slow.">
  <defs>
    <style>
      text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; font-size: 18px; fill: #e8edff; }
      .mut { fill: #9aa8c7; }
      .b { font-weight: 700; }
      .salmon { fill: #FF8A69; }
      .teal { fill: #72FCDB; }
      .mem { fill: #FF8A69; }
      .stream { fill: #72FCDB; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8c7"/></marker>
  </defs>
  <rect width="780" height="392" rx="12" fill="#041437"/>

  <!-- question -->
  <text class="b" x="30" y="44">Which step is slow?</text>

  <!-- in-memory: steps run one after another -->
  <text class="b salmon" x="30" y="92">IN-MEMORY</text>
  <text x="30" y="126">filter</text>
  <text x="30" y="161">join</text>
  <text x="30" y="196">group_by</text>
  <rect class="mem" x="150" y="108" width="60" height="26" rx="4"/>
  <rect class="mem" x="214" y="143" width="196" height="26" rx="4"/>
  <rect class="mem" x="414" y="178" width="40" height="26" rx="4"/>
  <text class="salmon" x="500" y="161">→ join takes the longest</text>

  <!-- streaming: steps overlap -->
  <text class="b teal" x="30" y="252">STREAMING</text>
  <text x="30" y="286">filter</text>
  <text x="30" y="321">join</text>
  <text x="30" y="356">group_by</text>
  <rect class="stream" x="150" y="268" width="250" height="26" rx="4"/>
  <rect class="stream" x="162" y="303" width="250" height="26" rx="4"/>
  <rect class="stream" x="174" y="338" width="250" height="26" rx="4"/>
  <text class="teal" x="500" y="321">→ can't tell</text>
</svg>
