<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="Bug 2, an email that fits two queues. 'i was charged when i used a us issued card. why and what cards are free to use to add money' fits billing, because of the charge, and top-up, because of adding money. The label says top-up only.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.muted { fill: #9aa8c7; }
		.row { fill: #9aa8c7; font-weight: 600; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.bad { fill: #FF8A69; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.hl { fill: #FF8A69; fill-opacity: 0.12; stroke: #FF8A69; stroke-width: 2; }
		.rule { stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
		.num { font-size: 15px; font-weight: 600; text-anchor: middle; }
		.badge { fill: #041437; stroke: #FF8A69; stroke-width: 1.5; }
	</style>
	<rect width="780" height="330" rx="12" fill="#041437"/>
	<rect x="130" y="28" width="520" height="84" rx="8" class="box"/>
	<text x="390" y="56" class="mid">"i was <tspan style="fill:#8fa8ff;font-weight:600">charged</tspan> when i used a us issued card.</text>
	<text x="390" y="84" class="mid">why and what cards are free to use to <tspan style="fill:#faa944;font-weight:600">add money</tspan>"</text>

	<path d="M300 116 L270 176" class="note" style="stroke:#8fa8ff" marker-end="url(#head)"/>
	<path d="M480 116 L510 176" class="note" style="stroke:#faa944" marker-end="url(#head)"/>

	<rect x="170" y="182" width="200" height="56" rx="8" class="box" style="stroke:#8fa8ff"/>
	<text x="270" y="210" class="mid b">billing <tspan class="ok">✓</tspan></text>
	<text x="270" y="258" class="mid muted">a charge</text>

	<rect x="410" y="182" width="200" height="56" rx="8" class="box" style="stroke:#faa944"/>
	<text x="510" y="210" class="mid b">top-up <tspan class="ok">✓</tspan></text>
	<text x="510" y="258" class="mid muted">adding money</text>

	<text x="390" y="300" class="mid">but the label says <tspan class="bad">top-up only</tspan></text>
</svg>
