<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" role="img" aria-label="Bug 4, a flaky grader, before and after build-eval. Run 1 and run 2 grade the same input and the same answer, account. Before, an LLM judge scores the answer from 1 to 5: it gives 5 and a pass on run 1, then 4 and a fail on run 2, so the verdict flips. After build-eval replaces it with a code check, the answer passes on both runs.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.muted { fill: #9aa8c7; }
		.row { fill: #9aa8c7; font-weight: 600; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.bad { fill: #FF8A69; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.strip { fill: #0b1d47; stroke: #c3d2f4; stroke-width: 1.5; }
		.hlbad { fill: #FF8A69; fill-opacity: 0.12; stroke: #FF8A69; stroke-width: 2; }
		.hlok { fill: #72FCDB; fill-opacity: 0.10; stroke: #72FCDB; stroke-width: 2; }
		.rule { stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
	</style>
	<rect width="780" height="306" rx="12" fill="#041437"/>

	<rect x="120" y="18" width="630" height="46" rx="8" class="strip"/>
	<text x="435" y="41" class="mid"><tspan class="muted">run 1 and run 2:</tspan> <tspan class="b">same input, same answer</tspan> <tspan class="muted">(account)</tspan></text>

	<text x="255" y="96" class="row mid">Before</text>
	<text x="615" y="96" class="row mid">After build-eval</text>

	<text x="24" y="147" class="row">grader</text>
	<text x="24" y="201" class="row">run 1</text>
	<text x="24" y="255" class="row">run 2</text>

	<!-- before -->
	<rect x="120" y="120" width="270" height="162" rx="8" class="box"/>
	<line x1="120" y1="174" x2="390" y2="174" class="rule"/>
	<line x1="120" y1="228" x2="390" y2="228" class="rule"/>
	<text x="140" y="147" class="b">LLM judge, 1 to 5</text>
	<text x="140" y="201">5</text>
	<text x="180" y="201">pass</text>
	<rect x="116" y="228" width="278" height="54" rx="6" class="hlbad"/>
	<text x="140" y="255" class="b">4</text>
	<text x="180" y="255" class="bad">fail</text>
	<text x="372" y="255" class="bad end">✗ flipped</text>

	<!-- arrow -->
	<line x1="402" y1="147" x2="468" y2="147" class="note" marker-end="url(#head)"/>

	<!-- after -->
	<rect x="480" y="120" width="270" height="162" rx="8" class="box"/>
	<line x1="480" y1="174" x2="750" y2="174" class="rule"/>
	<line x1="480" y1="228" x2="750" y2="228" class="rule"/>
	<text x="500" y="147" class="b">code check</text>
	<text x="500" y="201">pass</text>
	<rect x="476" y="228" width="278" height="54" rx="6" class="hlok"/>
	<text x="500" y="255" class="ok">pass</text>
	<text x="732" y="255" class="ok end">✓ same</text>
</svg>
