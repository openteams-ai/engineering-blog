<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" role="img" aria-label="Bug 1, a wrong label, before and after build-eval. For the email 'I forgot my password', the router answers account both times. Before, the label is billing, which is wrong, so the eval marks the right answer as a fail. After build-eval relabels it to account, the same answer passes.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.row { fill: #9aa8c7; font-weight: 600; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.bad { fill: #FF8A69; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.hlbad { fill: #FF8A69; fill-opacity: 0.12; stroke: #FF8A69; stroke-width: 2; }
		.hlok { fill: #72FCDB; fill-opacity: 0.10; stroke: #72FCDB; stroke-width: 2; }
		.rule { stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
	</style>
	<rect width="780" height="296" rx="12" fill="#041437"/>

	<text x="435" y="34" class="b mid">"I forgot my password"</text>

	<text x="255" y="82" class="row mid">Before</text>
	<text x="615" y="82" class="row mid">After build-eval</text>

	<text x="24" y="133" class="row">router</text>
	<text x="24" y="187" class="row">label</text>
	<text x="24" y="241" class="row">verdict</text>

	<!-- before -->
	<rect x="120" y="106" width="270" height="162" rx="8" class="box"/>
	<line x1="120" y1="160" x2="390" y2="160" class="rule"/>
	<line x1="120" y1="214" x2="390" y2="214" class="rule"/>
	<text x="140" y="133">account</text>
	<rect x="116" y="160" width="278" height="54" rx="6" class="hlbad"/>
	<text x="140" y="187" class="b">billing</text>
	<text x="372" y="187" class="bad end">✗ wrong</text>
	<text x="140" y="241" class="bad">fail</text>

	<!-- arrow -->
	<line x1="402" y1="187" x2="468" y2="187" class="note" marker-end="url(#head)"/>

	<!-- after -->
	<rect x="480" y="106" width="270" height="162" rx="8" class="box"/>
	<line x1="480" y1="160" x2="750" y2="160" class="rule"/>
	<line x1="480" y1="214" x2="750" y2="214" class="rule"/>
	<text x="500" y="133">account</text>
	<rect x="476" y="160" width="278" height="54" rx="6" class="hlok"/>
	<text x="500" y="187" class="b">account</text>
	<text x="732" y="187" class="ok end">✓ fixed</text>
	<text x="500" y="241" class="ok">pass</text>
</svg>
