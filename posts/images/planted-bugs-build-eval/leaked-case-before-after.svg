<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-label="Bug 5, a test case leaked into the prompt, before and after build-eval. The router's prompt has the example 'My top up is pending.' with the answer top-up. Before, the same email is also a test case, so the router passes only because it saw the answer. After build-eval replaces it with a new email that is not in the prompt, a pass or fail is earned.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.muted { fill: #9aa8c7; }
		.row { fill: #9aa8c7; font-weight: 600; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.bad { fill: #FF8A69; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.hlbad { fill: #FF8A69; fill-opacity: 0.12; stroke: #FF8A69; stroke-width: 2; }
		.hlok { fill: #72FCDB; fill-opacity: 0.10; stroke: #72FCDB; stroke-width: 2; }
		.rule { stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
	</style>
	<rect width="780" height="290" rx="12" fill="#041437"/>

	<text x="255" y="38" class="row mid">Before</text>
	<text x="615" y="38" class="row mid">After build-eval</text>

	<text x="24" y="100" class="row">prompt</text>
	<text x="24" y="172" class="row">test</text>
	<text x="24" y="235" class="row">verdict</text>

	<!-- before -->
	<rect x="120" y="64" width="270" height="198" rx="8" class="box"/>
	<line x1="120" y1="136" x2="390" y2="136" class="rule"/>
	<line x1="120" y1="208" x2="390" y2="208" class="rule"/>
	<text x="140" y="88">"My top up is pending."</text>
	<text x="140" y="112" class="muted">→ top-up</text>
	<rect x="116" y="136" width="278" height="72" rx="6" class="hlbad"/>
	<text x="140" y="160" class="b">"My top up is pending."</text>
	<text x="140" y="184" class="bad">✗ same as the prompt</text>
	<text x="140" y="235">pass</text>
	<text x="372" y="235" class="bad end">saw the answer</text>

	<!-- arrow -->
	<line x1="402" y1="172" x2="468" y2="172" class="note" marker-end="url(#head)"/>

	<!-- after -->
	<rect x="480" y="64" width="270" height="198" rx="8" class="box"/>
	<line x1="480" y1="136" x2="750" y2="136" class="rule"/>
	<line x1="480" y1="208" x2="750" y2="208" class="rule"/>
	<text x="500" y="88">"My top up is pending."</text>
	<text x="500" y="112" class="muted">→ top-up</text>
	<rect x="476" y="136" width="278" height="72" rx="6" class="hlok"/>
	<text x="500" y="160" class="b">a new email</text>
	<text x="500" y="184" class="ok">✓ not in the prompt</text>
	<text x="500" y="235">pass or fail</text>
	<text x="732" y="235" class="ok end">earned</text>
</svg>
