<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" role="img" aria-label="Bug 5, the answer is in the prompt. The router's prompt has the example 'My top up is pending.' with queue top-up, and a test case has the same email with expected answer top-up. The case passes, but only because the router saw the answer.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.muted { fill: #9aa8c7; }
		.row { fill: #9aa8c7; font-weight: 600; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.bad { fill: #FF8A69; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.hl { fill: #FF8A69; fill-opacity: 0.12; stroke: #FF8A69; stroke-width: 2; }
		.rule { stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
		.num { font-size: 15px; font-weight: 600; text-anchor: middle; }
		.badge { fill: #041437; stroke: #FF8A69; stroke-width: 1.5; }
	</style>
	<rect width="780" height="262" rx="12" fill="#041437"/>
	<text x="195" y="36" class="mid b">Router's prompt</text>
	<rect x="40" y="56" width="310" height="120" rx="8" class="box"/>
	<text x="62" y="96"><tspan class="muted">Email:</tspan> My top up is pending.</text>
	<text x="62" y="136"><tspan class="muted">Queue:</tspan> top-up</text>

	<text x="585" y="36" class="mid b">Test case</text>
	<rect x="430" y="56" width="310" height="120" rx="8" class="box"/>
	<text x="452" y="96"><tspan class="muted">Email:</tspan> My top up is pending.</text>
	<text x="452" y="136"><tspan class="muted">Expected:</tspan> top-up</text>

	<line x1="358" y1="116" x2="422" y2="116" class="note" style="stroke:#FF8A69" marker-start="url(#head)" marker-end="url(#head)"/>
	<text x="390" y="94" class="mid bad">same</text>

	<text x="390" y="218" class="mid"><tspan class="ok">✓ pass</tspan>, but only because it saw the answer</text>
</svg>
