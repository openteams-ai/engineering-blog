<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="Bug 2, an email with two right answers. The email about being charged when adding money with a US card could go to billing or top-up, and both are right, but the label accepts only top-up. build-eval flags it: this email has two right answers.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; dominant-baseline: central; }
		.muted { fill: #9aa8c7; }
		.b { font-weight: 600; }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.ok { fill: #72FCDB; font-weight: 600; }
		.flagt { fill: #faa944; font-weight: 600; }
		.box { fill: #0b1d47; stroke: #1d2b55; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
		.flag { fill: #faa944; fill-opacity: 0.12; stroke: #faa944; stroke-width: 2; }
	</style>
	<rect width="780" height="300" rx="12" fill="#041437"/>

	<!-- email -->
	<rect x="24" y="80" width="270" height="80" rx="8" class="box"/>
	<text x="44" y="108">"charged when adding</text>
	<text x="44" y="132">money with a US card"</text>

	<!-- split -->
	<path d="M294 120 H330 V64 H372" class="note" marker-end="url(#head)"/>
	<path d="M330 120 V176 H372" class="note" marker-end="url(#head)"/>

	<!-- answers -->
	<rect x="380" y="40" width="210" height="48" rx="8" class="box"/>
	<text x="400" y="64" class="b">billing</text>
	<text x="572" y="64" class="ok end">✓ right</text>

	<rect x="380" y="152" width="210" height="48" rx="8" class="box"/>
	<text x="400" y="176" class="b">top-up</text>
	<text x="572" y="176" class="ok end">✓ right</text>

	<!-- label note -->
	<line x1="626" y1="176" x2="600" y2="176" class="note" marker-end="url(#head)"/>
	<text x="636" y="164" class="muted">label accepts</text>
	<text x="636" y="188" class="muted">only this</text>

	<!-- flag -->
	<rect x="24" y="232" width="732" height="48" rx="8" class="flag"/>
	<text x="390" y="256" class="mid"><tspan class="flagt">⚑ build-eval flags it:</tspan> this email has two right answers</text>
</svg>
