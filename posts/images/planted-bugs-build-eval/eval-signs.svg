<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 616" role="img" aria-label="Score against effort for three model sizes. The strongest model scores highest at every effort level but stays below a perfect score, and each score has a short error bar.">
	<defs>
		<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10Z" fill="#c3d2f4"/>
		</marker>
	</defs>
	<style>
		text { font-family: "IBM Plex Sans", "Inter Tight", Helvetica, Arial, sans-serif; fill: #e8edff; font-size: 18px; }
		.muted { fill: #9aa8c7; }
		.label { font-weight: 600; text-anchor: end; }
		.num { font-size: 15px; font-weight: 600; fill: #e8edff; text-anchor: middle; dominant-baseline: central; }
		.badge { fill: #041437; stroke: #c3d2f4; stroke-width: 1.5; }
		.note { stroke: #c3d2f4; stroke-width: 1.5; fill: none; }
		.guide { stroke: #5b6b94; stroke-width: 1; stroke-dasharray: 4 4; }
	</style>

	<rect width="780" height="616" rx="12" fill="#041437"/>

	<!-- title -->
	<text x="40" y="52" style="font-size:22px;font-weight:600">Score against effort</text>
	<text x="40" y="80" class="muted">Three model sizes at three effort settings, illustrative</text>

	<!-- perfect score -->
	<line x1="60" y1="140" x2="740" y2="140" class="guide"/>
	<text x="60" y="128" class="muted">Perfect score</text>

	<!-- axes -->
	<line x1="230" y1="440" x2="680" y2="440" stroke="#5b6b94" stroke-width="1.5"/>
	<text x="270" y="470" class="muted" text-anchor="middle">low effort</text>
	<text x="420" y="470" class="muted" text-anchor="middle">medium effort</text>
	<text x="570" y="470" class="muted" text-anchor="middle">high effort</text>

	<!-- strongest model -->
	<polyline points="270,250 420,208 570,190" fill="none" stroke="#FF8A69" stroke-width="2.5"/>
	<g stroke="#FF8A69" stroke-width="1.5">
		<line x1="270" y1="242" x2="270" y2="258"/><line x1="264" y1="242" x2="276" y2="242"/><line x1="264" y1="258" x2="276" y2="258"/>
		<line x1="420" y1="200" x2="420" y2="216"/><line x1="414" y1="200" x2="426" y2="200"/><line x1="414" y1="216" x2="426" y2="216"/>
		<line x1="570" y1="182" x2="570" y2="198"/><line x1="564" y1="182" x2="576" y2="182"/><line x1="564" y1="198" x2="576" y2="198"/>
	</g>
	<circle cx="270" cy="250" r="6" fill="#FF8A69"/><circle cx="420" cy="208" r="6" fill="#FF8A69"/><circle cx="570" cy="190" r="6" fill="#FF8A69"/>
	<text x="245" y="256" class="label">Strongest model</text>

	<!-- mid-size model -->
	<polyline points="270,336 420,302 570,290" fill="none" stroke="#e8edff" stroke-width="2"/>
	<g stroke="#e8edff" stroke-width="1.5">
		<line x1="270" y1="328" x2="270" y2="344"/><line x1="264" y1="328" x2="276" y2="328"/><line x1="264" y1="344" x2="276" y2="344"/>
		<line x1="420" y1="294" x2="420" y2="310"/><line x1="414" y1="294" x2="426" y2="294"/><line x1="414" y1="310" x2="426" y2="310"/>
		<line x1="570" y1="282" x2="570" y2="298"/><line x1="564" y1="282" x2="576" y2="282"/><line x1="564" y1="298" x2="576" y2="298"/>
	</g>
	<circle cx="270" cy="336" r="6" fill="#e8edff"/><circle cx="420" cy="302" r="6" fill="#e8edff"/><circle cx="570" cy="290" r="6" fill="#e8edff"/>
	<text x="245" y="342" class="label">Mid-size model</text>

	<!-- smaller model -->
	<polyline points="270,398 420,376 570,366" fill="none" stroke="#9aa8c7" stroke-width="2" stroke-dasharray="6 5"/>
	<g stroke="#9aa8c7" stroke-width="1.5">
		<line x1="270" y1="390" x2="270" y2="406"/><line x1="264" y1="390" x2="276" y2="390"/><line x1="264" y1="406" x2="276" y2="406"/>
		<line x1="420" y1="368" x2="420" y2="384"/><line x1="414" y1="368" x2="426" y2="368"/><line x1="414" y1="384" x2="426" y2="384"/>
		<line x1="570" y1="358" x2="570" y2="374"/><line x1="564" y1="358" x2="576" y2="358"/><line x1="564" y1="374" x2="576" y2="374"/>
	</g>
	<circle cx="270" cy="398" r="6" fill="#9aa8c7"/><circle cx="420" cy="376" r="6" fill="#9aa8c7"/><circle cx="570" cy="366" r="6" fill="#9aa8c7"/>
	<text x="245" y="404" class="label">Smaller model</text>

	<!-- 2: better models score higher -->
	<line x1="500" y1="202" x2="500" y2="368" class="note" marker-start="url(#head)" marker-end="url(#head)"/>
	<circle cx="474" cy="252" r="13" class="badge"/><text x="474" y="252" class="num">2</text>

	<!-- 3: room to improve -->
	<line x1="576" y1="190" x2="720" y2="190" class="guide"/>
	<line x1="700" y1="144" x2="700" y2="186" class="note" marker-start="url(#head)" marker-end="url(#head)"/>
	<circle cx="728" cy="165" r="13" class="badge"/><text x="728" y="165" class="num">3</text>

	<!-- 4: same verdict every run -->
	<line x1="620" y1="406" x2="582" y2="378" class="note" marker-end="url(#head)"/>
	<circle cx="632" cy="415" r="13" class="badge"/><text x="632" y="415" class="num">4</text>

	<!-- legend: 2 rows so the numbers match the list in the post; 1 has no mark on the chart -->
	<line x1="0" y1="500" x2="780" y2="500" stroke="#1d2b55" stroke-width="1"/>
	<circle cx="54" cy="532" r="13" class="badge" stroke-dasharray="3 3"/><text x="54" y="532" class="num" style="fill:#9aa8c7">1</text>
	<text x="76" y="538" class="muted">Cases look like real use (not shown)</text>
	<circle cx="440" cy="532" r="13" class="badge"/><text x="440" y="532" class="num">2</text>
	<text x="462" y="538">Better models score higher</text>
	<circle cx="54" cy="574" r="13" class="badge"/><text x="54" y="574" class="num">3</text>
	<text x="76" y="580">Room to improve</text>
	<circle cx="440" cy="574" r="13" class="badge"/><text x="440" y="574" class="num">4</text>
	<text x="462" y="580">Same verdict every run</text>
</svg>
