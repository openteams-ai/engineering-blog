name: Social brief

# Every new post needs an answered social/<slug>.yml before merge. It seeds the
# LinkedIn post. This workflow asks for it in a PR comment, adds the empty
# template to the PR branch when it can, and fails the `social-brief` check
# until the author answers the questions, by hand or with any AI assistant.
# CI calls no model and needs no secrets.
#
# Runs only on PRs that touch posts/, so other PRs don't show the check. It's
# deliberately not a required check: GitHub can't require a check for only some
# PRs, and a required check that never runs blocks merge forever. The required
# review is the gate instead.
#
# pull_request_target, not pull_request, so PRs from forks also get a token
# that can comment. That token has write access, so this workflow must never
# run code from the PR: the scripts and dependencies come from main, and only
# the PR's posts/ and social/ files are read, as data (YAML is parsed with
# safe_load, posts are read as text).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'posts/**'

concurrency:
  group: social-brief-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  social-brief:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # main, i.e. the trusted scripts. The PR is fetched separately below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # By the SHA this event is for. refs/pull/<n>/head can still point at
      # the previous push when the job starts, and the check then reads the
      # old brief. This repo serves a fork PR's commit by SHA too.
      - name: Fetch the PR
        run: git fetch --no-tags origin "+$HEAD_SHA:refs/heads/pr-head"

      # Only newly added posts need a brief. Edits to live articles don't.
      # Three dots diff against the merge base, so posts that landed on main
      # after this branch was cut don't count.
      - name: Find new posts
        id: detect
        run: |
          {
            echo "post-files<<EOF"
            git diff --name-only --diff-filter=A "$BASE_SHA"...pr-head -- \
              'posts/*.md' 'posts/*.qmd'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Data only: the PR's posts and briefs, never its scripts or workflows.
      - name: Read the PR's posts and briefs
        if: steps.detect.outputs.post-files != ''
        run: |
          git checkout pr-head -- posts/
          git checkout pr-head -- social/ 2>/dev/null || true

      - uses: astral-sh/setup-uv@v4
        if: steps.detect.outputs.post-files != ''

      - name: Install dependencies
        if: steps.detect.outputs.post-files != ''
        run: uv sync

      # The token can't push to a fork, so fork PRs skip this. Their comment
      # links to a pre-filled "new file" page on the fork instead.
      - name: Add missing brief templates
        if: steps.detect.outputs.post-files != '' && env.SAME_REPO == 'true'
        env:
          POST_FILES: ${{ steps.detect.outputs.post-files }}
        run: |
          # The PR's tree, where the template gets committed. main's script
          # writes it; nothing from the PR is executed.
          git worktree add --quiet --detach ../pr pr-head
          cd ../pr
          # Post paths are slug-derived, so they never contain whitespace.
          # shellcheck disable=SC2086
          uv run --project "$GITHUB_WORKSPACE" python \
            "$GITHUB_WORKSPACE/scripts/social/create_brief.py" $POST_FILES
          git add social/
          git diff --cached --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: the check below already reports on this commit.
          # Without it, GitHub queues a second run that waits for approval.
          git commit --quiet -m "chore(social): add social brief template [skip ci]"
          git push --quiet origin "HEAD:$HEAD_REF"
          # So the check below sees the new templates.
          mkdir -p "$GITHUB_WORKSPACE/social"
          cp social/*.yml "$GITHUB_WORKSPACE/social/"

      # Records the result instead of failing here, so the comment below is
      # posted either way. The last step fails the job.
      - name: Check briefs are answered
        id: check
        env:
          POST_FILES: ${{ steps.detect.outputs.post-files }}
        run: |
          [ -z "$POST_FILES" ] && { echo "No new posts."; exit 0; }
          # shellcheck disable=SC2086
          if uv run scripts/social/check_brief.py --comment comment.md $POST_FILES; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      # One comment per PR, edited on every push: it asks for the brief while
      # answers are missing and says thanks once they're in. Same pinned action
      # as preview-draft.yml.
      - name: Ask the author to fill in the brief
        if: steps.detect.outputs.post-files != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: social-brief
          path: comment.md

      - name: Fail until every brief is answered
        if: steps.check.outputs.passed == 'false'
        run: |
          echo "A social brief still needs answers. See the PR comment or the errors above."
          exit 1
