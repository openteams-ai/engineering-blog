name: Social brief

# Every new post needs an answered social/<slug>.yml before merge. It seeds the
# LinkedIn post. This workflow commits the brief's questions to the PR branch as
# an empty template, and fails the `social-brief` check until the author
# answers them, by hand or with any AI assistant.
# CI calls no model and needs no secrets.
#
# No paths filter: `social-brief` is a required check, and a required check
# that never runs stays pending and blocks every PR that skips it. PRs without
# a new post pass in a few seconds.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: social-brief-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  social-brief:
    runs-on: ubuntu-latest
    steps:
      # The branch itself, not the merge commit, so the draft can be pushed
      # back to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Only newly added posts need a brief. Edits to live articles don't.
      # Three dots diff against the merge base, so posts that landed on main
      # after this branch was cut don't count.
      - name: Find new posts
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "post-files<<EOF"
            git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- \
              'posts/*.md' 'posts/*.qmd'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v4
        if: steps.detect.outputs.post-files != ''

      - name: Install dependencies
        if: steps.detect.outputs.post-files != ''
        run: uv sync

      # Forked PRs can't be pushed to, so they skip this. The check below
      # tells their authors how to add the brief themselves.
      - name: Add missing brief templates
        id: template
        if: >-
          steps.detect.outputs.post-files != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          POST_FILES: ${{ steps.detect.outputs.post-files }}
        run: |
          # Post paths are slug-derived, so they never contain whitespace.
          # shellcheck disable=SC2086
          uv run scripts/social/create_brief.py $POST_FILES

          if [ -n "$(git status --porcelain social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add social/
            # [skip ci]: this commit only adds the template, and the check
            # below already reports on it. Without this, GitHub queues a second
            # run that waits for approval.
            git commit -m "chore(social): add social brief template [skip ci]"
            git push
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi

      # Records the result instead of failing here, so the comment below is
      # posted either way. The last step fails the job.
      - name: Check briefs are answered
        id: check
        env:
          POST_FILES: ${{ steps.detect.outputs.post-files }}
        run: |
          [ -z "$POST_FILES" ] && { echo "No new posts."; exit 0; }
          # shellcheck disable=SC2086
          if uv run scripts/social/check_brief.py --comment comment.md $POST_FILES; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      # One comment per PR, edited on every push: it asks for the brief while
      # answers are missing and says thanks once they're in. Same pinned action
      # as preview-draft.yml. Forked PRs get a read-only token, so they rely on
      # the check's own error message.
      - name: Ask the author to fill in the brief
        if: >-
          steps.detect.outputs.post-files != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: social-brief
          path: comment.md

      - name: Fail until every brief is answered
        if: steps.check.outputs.passed == 'false'
        run: |
          echo "A social brief still needs answers. See the PR comment or the errors above."
          exit 1
