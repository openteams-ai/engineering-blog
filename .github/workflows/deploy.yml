name: Deploy

# Pull requests upload a preview version (live traffic is untouched) and
# comment its URL. Pushes to main deploy to openteams.com<BLOG_PATH>.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run build
      # Share cards: reused from the live site, new or changed ones rendered
      # (Chromium is installed only when there is something to render).
      - run: npm run og

      - name: Check Cloudflare token
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, nothing deployed"
          [ "${{ github.event_name }}" = "pull_request" ]

      - name: Deploy preview
        if: github.event_name == 'pull_request' && steps.token.outputs.set == 'true'
        run: |
          set -o pipefail
          node scripts/deploy.ts "pr-${{ github.event.number }}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          path=$(node -e 'import("./src/lib/blog-path.ts").then(m => console.log(m.BLOG_PATH))')
          body="Preview: ${url}${path}/"
          gh pr comment "${{ github.event.number }}" --edit-last --body "$body" \
            || gh pr comment "${{ github.event.number }}" --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy production
        if: github.event_name == 'push' && steps.token.outputs.set == 'true'
        run: node scripts/deploy.ts

      # Posts this push added, not ones it edited. Only the two commits'
      # trees are needed, so the shallow checkout plus one fetch is enough.
      - name: Announce new posts in Slack
        if: github.event_name == 'push' && steps.token.outputs.set == 'true'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          SLACK_PUBLISH_WEBHOOK: ${{ secrets.SLACK_PUBLISH_WEBHOOK }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE"
          # No pathspec on the diff: git pairs a moved post with its old path only
          # when it sees both, so a move doesn't count as a new post.
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BEFORE" HEAD | grep -E '^posts/[^/]+\.md$')
          [ "${#added[@]}" -eq 0 ] && { echo "No new posts."; exit 0; }
          node scripts/notify-published.ts "${added[@]}"
