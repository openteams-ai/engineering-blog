name: Request topic reviewers

# Reviewers sign up by putting a 👍 on a topic's comment in the sign-up issue.
# The votes are read when a post PR is ready for review, so a new 👍 counts
# from the next post on, with no list to keep in sync.
#
# pull_request_target so PRs from forks get a token that can request reviews.
# The checkout is main, not the PR, and the script reads the PR's posts
# through the GitHub API, as data, so nothing from the PR runs.
on:
  pull_request_target:
    types: [opened, ready_for_review]
    paths:
      - 'posts/**'

jobs:
  request:
    # A draft can hold a test post that never ships.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: node scripts/request-reviewers.ts "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
