problem: "Transformer attention kernels waste memory because minimality is only measured after implementation, not proven before code exists."
what_it_does: "Derives the memory lower bound using Mathematics of Arrays, constructs the first attention kernel proven minimal before coding, and validates it across two HPC clusters including Stampede3 with CPU and GPU sweeps and a 2.4MB reproducible artifact."
remember_one_thing: "You can prove a transformer kernel is memory-minimal before writing it, and the proof holds on real hardware."
audience: ["ml-ai-engineers", "engineering-leaders"]
