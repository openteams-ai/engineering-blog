# What problem does this article solve? (1-2 sentences)
problem: "AI agents write code that compiles and passes tests but breaks conventions from niche ecosystems like JupyterLab, and instructions in AGENTS.md are easy for them to skip without anyone noticing."

# What does the article build, test, compare, or argue? (1-2 sentences)
what_it_does: "Argues that custom lint rules steer agents more reliably than AGENTS.md, using @jupyter/eslint-plugin examples like Galata test helpers and plugin IDs, and gives a checklist for when a convention deserves its own rule."

# If readers remember one thing, what should it be? (1 sentence)
remember_one_thing: "If a convention breaks silently and you keep repeating it in review, turn it into a lint rule with a clear error message that agents and new contributors can act on."

